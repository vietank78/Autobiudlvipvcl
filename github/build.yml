Tôi cần thêm actions để tải file
Hiển thị
Để bạn có thể dễ dàng tải file kết quả build (file .jar) và quản lý các bản phát hành (releases) trên GitHub một cách tự động hóa, chúng ta cần sử dụng GitHub Actions để xây dựng pipeline (CI/CD).

Dưới đây là hướng dẫn chi tiết cách thiết lập hệ thống Actions để tự động Build mod và cung cấp link tải file .jar về máy tính của bạn (hoặc người dùng khác), kèm theo code Java hỗ trợ tải schematic (.litematic) từ URL về máy tự động nếu bạn muốn mod tự tải file về thay vì copy thủ công.

Phần 1: GitHub Actions để Build và Tải file .jar tự động
GitHub Actions giúp mỗi khi bạn push code lên hoặc tạo một bản release (tag), hệ thống sẽ tự động biên dịch mod và đóng gói file .jar làm một tài sản (Artifact) hoặc đính kèm vào bản phát hành, tạo ra đường link tải trực tiếp.

Bước 1: Tạo file Workflow Actions
Tạo thư mục .github/workflows/ trong repository của bạn, và tạo file build-and-release.yml với nội dung sau:


name: Build and Release AutoBuild Mod

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Kích hoạt khi bạn tạo tag bắt đầu bằng v (ví dụ: v1.0.0)
  workflow_dispatch: # Cho phép bạn chạy thủ công từ giao diện GitHub
    inputs:
      release_tag:
        description: 'Nhập tên tag để tạo release (ví dụ: v1.0.0)'
        required: false
        default: 'latest'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build mod jar
        run: ./gradlew jar

      - name: Upload build artifact (Dành cho các build thường xuyên)
        uses: actions/upload-artifact@v4
        with:
          name: autobuild-mod-jar
          path: build/libs/*.jar
          retention-days: 7 # Giữ file kết quả trong 7 ngày để bạn có thể tải về

  create-release:
    needs: build-and-package
    runs-on: ubuntu-latest
    # Chỉ chạy job này khi push lên các tag (ví dụ: v1.0, v1.0.0)
    if: startsWith(github.ref, 'tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew jar

      - name: Create Release and Upload Jar
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          name: AutoBuild Mod Release ${{ github.ref_name }}
          body: |
            ### AutoBuild Mod Release ${{ github.ref_name }}
            - Hỗ trợ Minecraft 1.21.11 và Fabric API.
            - Tự động xây công trình từ file schematic và lấy vật liệu từ rương.
          draft: false
          prerelease: false
Bước 2: Cách sử dụng và tải file về
Build thường dùng (Lưu artifact):
Khi bạn push code lên nhánh main, Actions sẽ tự động chạy và tạo file .jar.
Để tải file này về, vào tab Actions trên GitHub repository của bạn. Nhấn vào lần build vừa chạy, bên phải sẽ có mục Artifacts, bạn bấm download để lấy file .jar.
Tạo bản phát hành chính thức (Release):
Để tạo đường link tải vĩnh viễn, bạn tạo một tag trên GitHub: Chọn tag, đặt tên bắt đầu bằng chữ v (ví dụ: v1.0.0), rồi push.
GitHub Actions sẽ tự động biên dịch, tạo trang Releases và đính kèm file .jar. Bạn chia sẻ link trang Release đó cho người dùng.
Phần 2: Tự động tải file schematic (.litematic) từ URL về trong Mod
Nếu ý bạn "thêm actions để tải file" là muốn mod tự động tải các file schematic (.litematic) từ một đường link internet (URL) về thư mục của mod, thay vì bạn phải manually copy file vào thư mục, hãy dùng class utility dưới đây.

Tạo file Java: src/main/java/com/autobuild/utils/FileDownloader.java


package com.autobuild.utils;

import net.minecraft.client.MinecraftClient;
import java.io.File;
import java.io.IOException;
import java.net.URI;
import java.net.URL;
import java.nio.file.Files;
import java.nio.file.Paths;
import java.nio.file.StandardCopyOption;

public class FileDownloader {

    private static final MinecraftClient client = MinecraftClient.getInstance();

    /**
     * Tải một file từ URL về thư mục chỉ định của mod.
     * Ví dụ: Tải file .litematic về thư mục config/autobuild/schematics/
     */
    public static boolean downloadFile(String fileUrl, String destinationPath) {
        try {
            File destFile = new File(destinationPath);
            // Đảm bảo thư mục cha tồn tại
            File parentDir = destFile.getParentFile();
            if (!parentDir.exists()) {
                if (!parentDir.mkdirs()) {
                    System.err.println("Failed to create directory: " + parentDir.getAbsolutePath());
                    return false;
                }
            }

            // Tải file về temporary rồi copy sang đúng vị trí để tránh corrupt file khi đang download
            URL url = new URL(fileUrl);
            File tempFile = File.createTempFile("temp_", "_" + destFile.getName());
            Files.copy(url.openStream(), tempFile.toPath(), StandardCopyOption.REPLACE_EXISTING);

            // Move temp file to destination
            Files.move(tempFile.toPath(), destFile.toPath(), StandardCopyOption.REPLACE_EXISTING);
            System.out.println("Successfully downloaded file to: " + destinationPath);
            return true;
        } catch (IOException e) {
            System.err.println("Failed to download file from " + fileUrl + ": " + e.getMessage());
            return false;
        }
    }

    /**
     * Lấy đường dẫn thư mục schematics của mod
     */
    public static String getSchematicDirectory() {
        if (client.runDirectory == null) return "schematics/";
        return client/runDirectory.getAbsolutePath() + "/config/autobuild/schematics/";
    }
}
Cách tích hợp lệnh tải file trong Mod:
Bạn có thể đăng ký một lệnh trong chat để mod tự tải một schematic về. Ví dụ: /autobuild get <url>.

Dưới đây là snippet đăng ký command handling đơn giản (có thể tích hợp vào AutoBuildMod.java):


// Ví dụ sử dụng trong tick hoặc khi nhận được chat message:
if (client.player != null && client.player.getCommandSource().getWorld() != null) {
    String msg = client.player.getName().getString();
    // Logic parse command "/autobuild get https://example.com/my_house.litematic"
    if (msg.startsWith("/autobuild get ")) {
        String url = msg.substring(16);
        String dest = FileDownloader.getSchematicDirectory() + "my_house.litematic";
        FileDownloader.downloadFile(url, dest);
    }
}
Tổng kết hành động tiếp theo:
Nếu mục tiêu của bạn là có thể tải file .jar mod về máy tính: Hãy copy nội dung file YAML ở Phần 1 vào file .github/workflows/build-and-release.yml. Khi bạn push lên GitHub, bạn sẽ thấy tab Actions chạy thành công và có thể download file .jar về.
Nếu bạn muốn mod tự tải schematic về qua internet: Dùng class FileDownloader ở Phần 2 và gọi nó qua một lệnh chat.
