2. Code Chi Tiết
A. ChestGUIManager.java (Quản lý mở rương và tự động click)
Lưu ý: Để tự động click vào các slot trong GUI rương, ta cần tính toán tọa độ màn hình (x, y) tương ứng với từng slot dựa trên chuẩn layout của ChestScreen.


package com.autobuild.inventory;

import net.minecraft.block.entity.ChestBlockEntity;
import net.minecraft.client.MinecraftClient;
import net.minecraft.client.network.ClientPlayerEntity;
import net.minecraft.client.screen.ChestScreen;
import net.minecraft.client.screen.Screen;
import net.minecraft.inventory.Inventory;
import net.minecraft.item.Item;
import net.minecraft.item.Items;
import net.minecraft.util.math.BlockPos;
import net.minecraft.util.math.Vec3d;
import net.minecraft.util.Hand;

public class ChestGUIManager {

    private static final MinecraftClient client = MinecraftClient.getInstance();
    private static ChestBlockEntity currentTargetChest = null;
    private static int clickCount = 0;
    private static Item targetItem = null;
    private static int targetAmount = 0;
    private static int currentAmountTaken = 0;

    /**
     * Bắt đầu quá trình mở rương và lấy item tự động.
     */
    public static void startAutoWithdraw(ChestBlockEntity chest, Item item, int amount) {
        currentTargetChest = chest;
        targetItem = item;
        targetAmount = amount;
        currentAmountTaken = 0;
        clickCount = 0;

        // Gửi packet tương tác để mở rương
        openChest(chest);
    }

    /**
     * Gửi packet tương tác với block rương để server mở GUI cho client.
     */
    private static void openChest(ChestBlockEntity chest) {
        ClientPlayerEntity player = client.player;
        if (player == null || client.world == null) return;

        // Tính hit vector vào giữa block rương
        Vec3d hitCenter = new Vec3d(chest.getPos().getX() + 0.5, chest.getPos().getY() + 0.5, chest.getPos().getZ() + 0.5);
        client.getInteractionManager().interactBlock(
                player,
                client.world,
                Hand.MAIN_HAND,
                chest.getPos(),
                net.minecraft.util.math.Direction.UP,
                hitCenter
        );
    }

    /**
     * Xử lý logic tự động click khi GUI rương đã mở.
     * Gọi trong main mod tick event.
     */
    public static void tickAutoWithdraw() {
        if (currentTargetChest == null) return;

        Screen screen = client.currentScreen;
        if (screen instanceof ChestScreen chestScreen) {
            // Kiểm tra xem slot chứa targetItem ở inventory rương
            Inventory chestInventory = currentTargetChest.getInventory();
            int slotIndex = -1;
            for (int i = 0; i < chestInventory.size(); i++) {
                if (chestInventory.getStack(i).isOf(targetItem)) {
                    slotIndex = i;
                    break;
                }
            }

            if (slotIndex != -1) {
                // Slot 0-26 là các slot trong rương (3 rows x 9 columns)
                // Layout chest screen: Starts at x = (width - 9*18)/2, y = (height - 3*18)/2 - 10 or similar
                int slotX = chestScreen.getX() + (slotIndex % 9) * 18 + 9;
                int slotY = chestScreen.getY() + (slotIndex / 9) * 18 + 9;

                // Simulate left click
                chestScreen.mouseClicked(slotX, slotY, 0);
                clickCount++;

                // Kiểm tra xem đã đủ số lượng chưa (giả định mỗi click lấy 1 stack hoặc 1 item)
                // Trong thực tế, cần check số item trong inventory người chơi tăng lên
                if (currentAmountTaken >= targetAmount || clickCount >= 64) {
                    // Đóng GUI rương để quay lại xây
                    client.player.closeHandledScreen();
                    currentTargetChest = null;
                }
            } else {
                // Không tìm thấy item trong rương này, đóng GUI và báo lỗi/thử rương khác
                client.player.closeHandledScreen();
                currentTargetChest = null;
            }
        } else {
            // Chờ GUI load, nếu quá 10 tick mà chưa mở thì lỗi
            clickCount++;
            if (clickCount > 20) {
                currentTargetChest = null; // Timeout
            }
        }
    }
}
B. BuildPlanner.java (Lên kế hoạch xây từng Layer)
Phân loại và sắp xếp thứ tự các block để tối ưu đường đi, tránh kẹt, và đảm bảo các block phụ thuộc (như redstone, piston, nước) được đặt đúng thứ tự.


package com.autobuild.planner;

import com.autobuild.schematic.SchematicLoader;
import com.autobuild.config.Config;
import net.minecraft.block.Blocks;
import net.minecraft.util.math.BlockPos;

import java.util.*;
import java.util.stream.Collectors;

public class BuildPlanner {

    public static class BuildStep {
        public final int x, y, z;
        public final String blockState;
        public final int priority; // 0: Normal, 1: Redstone/Piston, 2: Liquid (Water/Lava)

        public BuildStep(int x, int y, int z, String state, int priority) {
            this.x = x;
            this.y = y;
            this.z = z;
            this.blockState = state;
            this.priority = priority;
        }
    }

    /**
     * Sắp xếp các block thành các Layer (từ Y thấp lên Y cao),
     * bên trong mỗi layer sắp xếp theo thứ tự ưu tiên và khoảng cách tối ưu (Snake pattern).
     */
    public static Map<Integer, List<BuildStep>> planLayers(List<SchematicLoader.ParsedBlock> blocks, int anchorX, int anchorY, int anchorZ) {
        Map<Integer, List<BuildStep>> layers = new HashMap<>();

        // 1. Phân loại block vào các layer tương ứng
        for (SchematicLoader.ParsedBlock parsed : blocks) {
            // Áp dụng xoay và mirror nếu có (đơn giản hóa ở đây: dùng tọa độ gốc)
            int tx = anchorX + parsed.localX;
            int ty = anchorY + parsed.localY;
            int tz = anchorZ + parsed.localZ;

            int priority = getPriority(parsed.blockStateString);
            layers.computeIfAbsent(ty, k -> new ArrayList<>())
                    .add(new BuildStep(tx, ty, tz, parsed.blockStateString, priority));
        }

        // 2. Sắp xếp thứ tự trong từng layer
        for (List<BuildStep> layer : layers.values()) {
            sortLayer(layer);
        }

        return layers;
    }

    /**
     * Phân loại độ ưu tiên:
     * 0: Block vật liệu thường (dirt, stone, glass...)
     * 1: Redstone, Piston, Observer, Repeater (phụ thuộc vào logic redstone)
     * 2: Nước, Lava (phải đặt cuối cùng để không làmôi lan)
     */
    private static int getPriority(String state) {
        String lower = state.toLowerCase();
        if (lower.contains("water") || lower.contains("lava")) {
            return 2;
        }
        if (lower.contains("piston") || lower.contains("observer") || lower.contains("redstone") || lower.contains("repeater") || lower.contains("comparator")) {
            return 1;
        }
        return 0;
    }

    /**
     * Sắp xếp các block trong layer theo thứ tự:
     * Ưu tiên theo priority (0 -> 1 -> 2).
     * Với mỗi priority, sắp xếp theo đường đi Snake (xoắn ốc) để di chuyển ít nhất:
     * Ví dụ: đi từ trái sang phải, rồi phải sang trái ở hàng tiếp theo.
     */
    private static void sortLayer(List<BuildStep> steps) {
        // Sắp xếp theo priority trước
        steps.sort(Comparator.comparingInt(s -> s.priority));

        // Sắp xếp lại tọa độ để tạo đường đi Snake pattern
        // Nhóm các block theo priority, rồi sort theo Z, rồi X
        List<BuildStep> p0 = steps.stream().filter(s -> s.priority == 0).collect(Collectors.toList());
        List<BuildStep> p1 = steps.stream().filter(s -> s.priority == 1).collect(Collectors.toList());
        List<BuildStep> p2 = steps.stream().filter(s -> s.priority == 2).collect(Collectors.toList());

        snakeSort(p0);
        snakeSort(p1);
        snakeSort(p2);

        steps.clear();
        steps.addAll(p0);
        steps.addAll(p1);
        steps.addAll(p2);
    }

    private static void snakeSort(List<BuildStep> list) {
        if (list.isEmpty()) return;
        // Sort theo Z trước, rồi X
        list.sort(Comparator.comparingInt((BuildStep s) -> s.z).thenComparingInt(s -> s.x));
        // Reverse lại nếu cần thiết để tạo thành zig-zag
    }
}
C. BlockPlacer.java (Xử lý đặt block đúng hướng và dùng giàn tạm)
Để đặt block có hướng (như stairs, piston, observer) đúng với blockstate trong schematic, chúng ta cần dùng một block tạm (scaffolding như kính Glass) làm điểm tựa, đứng ở vị trí phù hợp và click vào mặt của block tạm đó.


package com.autobuild.placement;

import net.minecraft.client.MinecraftClient;
import net.minecraft.client.network.ClientPlayerEntity;
import net.minecraft.client.world.ClientWorld;
import net.minecraft.item.Item;
import net.minecraft.item.Items;
import net.minecraft.util.math.BlockPos;
import net.minecraft.util.math.Vec3d;
import net.minecraft.util.Hand;
import net.minecraft.util.math.Direction;
import net.minecraft.block.BlockState;
import net.minecraft.block.StairsBlock;
import net.minecraft.block.SlabBlock;
import net.minecraft.block.PistonBlock;
import net.minecraft.util.math.Vec3i;

public class BlockPlacer {

    private static final MinecraftClient client = MinecraftClient.getInstance();

    /**
     * Thực hiện đặt một block tại tọa độ target với block state chỉ định.
     * Nếu block lơ lửng (không có block kế bên dưới làm điểm tựa), ta sẽ đặt một block tạm (kính) làm giàn.
     */
    public static void placeBlock(BlockPos target, String blockStateString) {
        ClientWorld world = client.world;
        ClientPlayerEntity player = client.player;
        if (world == null || player == null) return;

        // 1. Parse block state string để biết block cần đặt là gì
        // Ví dụ: "minecraft:redstone", "minecraft:stone_slab[facing=north,...]"
        String[] parts = blockStateString.split("\\[");
        String itemId = parts[0];
        Item item = parseItem(itemId);

        // 2. Kiểm tra xem block có cần điểm tựa (support) không
        // Nếu dưới target là air, ta cần đặt block tạm (kính) ở dưới target trước
        if (world.getBlockState(target.down()).isAir()) {
            placeTemporarySupport(target.down());
        }

        // 3. Xác định mặt block cần click để đặt (dựa trên blockState properties)
        // Với block có hướng (stairs, piston): ta cần đứng ở phía đối diện và nhìn về phía target
        Direction placeDirection = calculatePlacementDirection(blockStateString, target);

        // 4. Tính tọa độ hit vector
        Vec3d hitVec = new Vec3d(
                target.getX() + 0.5 + placeDirection.getVectorZ() * 0.5,
                target.getY() + 0.5 + placeDirection.getVectorY() * 0.5,
                target.getZ() + 0.5 + placeDirection.getVectorX() * 0.5
        );

        // 5. Đặt block
        selectItemInHotbar(item);
        client.getInteractionManager().interactBlock(
                player,
                world,
                Hand.MAIN_HAND,
                target,
                placeDirection.getOpposite(),
                hitVec
        );
    }

    /**
     * Đặt một block kính (Glass) tạm thời làm giàn nâng/dự phòng.
     */
    private static void placeTemporarySupport(BlockPos pos) {
        ClientWorld world = client.world;
        ClientPlayerEntity player = client.player;
        if (world == null || player == null) return;

        Item glassItem = Items.GLASS;
        selectItemInHotbar(glassItem);

        // Đặt kính ở pos
        client.getInteractionManager().interactBlock(
                player, world, Hand.MAIN_HAND, pos, Direction.UP,
                new Vec3d(pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5)
        );
    }

    /**
     * Phân tích chuỗi blockState để xác định hướng đặt block.
     * Ví dụ: Nếu block là stairs và có property facing=north, ta cần đặt nó trên mặt nam của block kế bên.
     */
    private static Direction calculatePlacementDirection(String stateString, startPos) {
        if (stateString.contains("facing=")) {
            String facingStr = stateString.substring(stateString.indexOf("facing=") + 7).split(",")[0].toUpperCase();
            try {
                return Direction.valueOf(facingStr);
            } catch (IllegalArgumentException e) {
                return Direction.UP;
            }
        }
        return Direction.UP; // Default
    }

    /**
     * Parse chuỗi item string thành Item object (ví dụ: "minecraft:stone" -> Items.STONE)
     */
    private static Item parseItem(String itemId) {
        if (itemId.contains(":")) {
            String name = itemId.split(":")[1].toLowerCase();
            // Simple mapping, có thể mở rộng bằng reflection hoặc registry lookup
            switch (name) {
                case "dirt": return Items.DIRT;
                case "stone": return Items.STONE;
                case "obsidian": return Items.OBSIDIAN;
                case "redstone": return Items.REDSTONE;
                case "glass": return Items.GLASS;
                // Thêm các block khác nếu cần
                default: return Items.STONE; // Fallback
            }
        }
        return Items.STONE;
    }

    /**
     * Chọn item tương ứng trong hotbar của người chơi.
     */
    private static void selectItemInHotbar(Item item) {
        ClientPlayerEntity player = client.player;
        if (player == null) return;

        for (int i = 0; i < 9; i++) {
            if (player.getInventory().getStack(i).isOf(item)) {
                player.getInventory().selectedSlot = i;
                return;
            }
        }
        // Nếu không có trong hotbar, có thể thêm logic lấy từ inventory chính
    }
}
