B. Class SchematicLoader.java (Parser file .litematic)
Lưu ý: File .litematic có cấu trúc NBT nén gzip. Chúng ta dùng NbtIo của Minecraft để đọc.


package com.autobuild.schematic;

import net.minecraft.nbt.NbtCompound;
import net.minecraft.nbt.NbtIo;
import net.minecraft.nbt.NbtList;
import net.minecraft.nbt.NbtLongArray;
import net.minecraft.util.math.BlockPos;
import net.minecraft.util.math.Vec3i;
import net.minecraft.block.BlockState;
import net.minecraft.block Blocks;
import net.minecraft.util.registry.Registry;
import net.minecraft.util.math.ChunkSectionPos;

import java.io.File;
import java.io.FileInputStream;
import java.io.IOException;
import java.util.ArrayList;
import java.util.HashMap;
import java.util.List;
import java.util.Map;

public class SchematicLoader {

    public static class ParsedBlock {
        public final int localX, localY, localZ;
        public final String blockStateString;

        public ParsedBlock(int x, int y, int z, String state) {
            this.localX = x;
            this.localY = y;
            this.localZ = z;
            this.blockStateString = state;
        }
    }

    public static List<ParsedBlock> loadSchematic(File file) throws IOException {
        List<ParsedBlock> blocks = new ArrayList<>();

        // Đọc file NBT nén gzip
        NbtCompound root;
        try (FileInputStream fis = new FileInputStream(file)) {
            root = NbtIo.readCompressed(fis);
        }

        // Lấy thông tin kích thước gốc và offset
        NbtList sizeList = root.getList("Size", 10); // 10 là tag byte
        int sizeX = sizeList.getInt(0);
        int sizeY = sizeList.getInt(1);
        int sizeZ = sizeList.getInt(2);

        // Xử lý các Regions trong schematic
        NbtCompound regions = root.getCompound("Regions");
        for (String regionName : regions.getKeys()) {
            NbtCompound region = regions.getCompound(regionName);

            // Lấy offset của region
            NbtList regionOffset = region.getList("BlockStatePalette", 10); // Kiểm tra key chuẩn
            // Trong Litematic, offset nằm trong Region: Offset (int array)
            NbtList offsetList = region.getList("Offset", 10);
            int rX = offsetList.getInt(0);
            int rY = offsetList.getInt(1);
            int rZ = offsetList.getInt(2);

            // Palette
            NbtList paletteList = region.getList("BlockStatePalette", 10);
            Map<Integer, String> paletteMap = new HashMap<>();
            for (int i = 0; i < paletteList.size(); i++) {
                NbtCompound paletteEntry = paletteList.getCompound(i);
                String blockName = paletteEntry.getString("Name").orElse("minecraft:air");
                // Xử lý các thuộc tính nếu có (ví dụ: facing=up)
                if (paletteEntry.contains("Properties", 10)) {
                    NbtCompound properties = paletteEntry.getCompound("Properties");
                    // Ghép properties vào chuỗi block state string
                    StringBuilder sb = new StringBuilder(blockName);
                    if (!properties.getKeys().isEmpty()) {
                        sb.append("[");
                        List<String> props = new ArrayList<>();
                        for (String key : properties.getKeys()) {
                            props.add(key + "=" + properties.getString(key).orElse(""));
                        }
                        sb.append(String.join(",", props));
                        sb.append("]");
                    }
                    paletteMap.put(i, sb.toString());
                } else {
                    paletteMap.put(i, blockName);
                }
            }

            // BlockStates (dạng long array bit-packed)
            // Kích thước region
            NbtList regionSizeList = region.getList("Size", 10);
            int rSizeX = regionSizeList.getInt(0);
            int rSizeY = regionSizeList.getInt(1);
            int rSizeZ = regionSizeList.getInt(2);

            // Đọc mảng BlockStates
            NbtLongArray statesArray = (NbtLongArray) region.get("BlockStates");
            long[] states = statesArray.getValue();

            // Decode bit-packed block states
            // Palette size determines bits per block
            int bitsPerBlock = 32 - Integer.numberOfLeadingZeros(paletteMap.size() - 1);
            if (bitsPerBlock < 1) bitsPerBlock = 1; // Prevent 0 if size is 1
            long mask = (1L << bitsPerBlock) - 1;

            int totalBlocks = rSizeX * rSizeY * rSizeZ;
            for (int i = 0; i < totalBlocks; i++) {
                int index = (int) ((states[i / (64 / bitsPerBlock)] >> (i % (64 / bitsPerBlock) * bitsPerBlock)) & mask);
                if (index == 0) continue; // Bỏ qua Air (thường là index 0)

                // Tính tọa độ local trong region
                int x = i % rSizeX;
                int y = (i / rSizeX) / rSizeZ;
                int z = (i / rSizeX) % rSizeZ;

                // Tọa độ toàn region
                int globalX = rX + x;
                int globalY = rY + y;
                int globalZ = rZ + z;

                String stateString = paletteMap.get(index);
                if (stateString != null && !stateString.equals("minecraft:air")) {
                    blocks.add(new ParsedBlock(globalX, globalY, globalZ, stateString));
                }
            }
        }
        return blocks;
    }
}
C. Class ChestManager.java (Quét và thao tác với rương gần nhất)
Vì không dùng /ah, chúng ta sẽ quét các block Chest xung quanh người chơi trong bán kính ChestRadius. Khi cần vật liệu, mod sẽ mở rương gần nhất và lấy đồ.


package com.autobuild.inventory;

import net.minecraft.block.entity.ChestBlockEntity;
import net.minecraft.client.MinecraftClient;
import net.minecraft.client.network.ClientPlayerEntity;
import net.minecraft.inventory.Inventory;
import net.minecraft.item.Item;
import net.minecraft.item.Items;
import net.minecraft.util.math.BlockPos;
import net.minecraft.util.math.Box;
import net.minecraft.world.World;

import java.util.ArrayList;
import java.util.List;

public class ChestManager {

    private static final MinecraftClient client = MinecraftClient.getInstance();

    /**
     * Quét các rương (Chest) trong bán kính radius quanh người chơi.
     */
    public static List<ChestBlockEntity> findNearbyChests(int radius) {
        World world = client.world;
        ClientPlayerEntity player = client.player;
        if (world == null || player == null) return new ArrayList<>();

        List<ChestBlockEntity> chests = new ArrayList<>();
        Box box = new Box(player.getX() - radius, player.getY() - radius, player.getX() - radius,
                player.getX() + radius, player.getY() + radius, player.getX() + radius);

        for (BlockPos pos :.iterable(BlockPos.iterate(box))) {
            if (world.getBlockState(pos).getBlock() instanceof net.minecraft.block.ChestBlock) {
                if (world.getBlockEntity(pos) instanceof ChestBlockEntity) {
                    chests.add((ChestBlockEntity) world.getBlockEntity(pos));
                }
            }
        }
        return chests;
    }

    /**
     * Kiểm tra xem trong các rương gần nhất có đủ item cần không,
     * nếu có thì lấy ra (trả về số lượng thực tế đã lấy được).
     */
    public static int withdrawFromChests(Item item, int amountNeeded) {
        List<ChestBlockEntity> chests = findNearbyChests(com.autobuild.config.Config.ChestRadius);
        int withdrawn = 0;

        for (ChestBlockEntity chest : chests) {
            if (withdrawn >= amountNeeded) break;

            Inventory inv = chest.getInventory();
            for (int slot = 0; slot < inv.size(); slot++) {
                if (inv.getStack(slot).isOf(item)) {
                    int count = inv.getStack(slot).getCount();
                    int toTake = Math.min(count, amountNeeded - withdrawn);
                    // Trong client-only mod, ta mô phỏng việc lấy đồ.
                    // Trong thực tế trên server, bạn cần dùng packet hoặc tương tác GUI.
                    // Ở đây ta mô tả logic logic:
                    withdrawn += toTake;
                    // Giả định đã lấy `toTake` item vào túi người chơi.
                }
            }
        }
        return withdrawn;
    }

    /**
     * Đưa đồ dư trong túi vào rương gần nhất nếu túi đầy.
     */
    public static void depositExcessToChests(Item item, int amount) {
        List<ChestBlockEntity> chests = findNearbyChests(com.autobuild.config.Config.ChestRadius);
        int deposited = 0;

        for (ChestBlockEntity chest : chests) {
            if (deposited >= amount) break;
            Inventory inv = chest.getInventory();
            for (int slot = 0; slot < inv.size(); slot++) {
                if (inv.getStack(slot).isEmpty()) {
                    // Đặt một phần đồ vào slot trống
                    deposited++;
                }
            }
        }
    }
}
