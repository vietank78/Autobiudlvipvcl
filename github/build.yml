Dựa trên ảnh chụp màn hình của bạn, bạn đang ở trang cài đặt GitHub Actions trong repository vietank78/Autobuild... (đường dẫn github.com/vietank78/Autobuild...).

Để bạn có thể tự động build mod ra file .jar và tải file kết quả về máy tính, bạn cần tạo một file cấu hình workflow (file YAML) trong thư mục .github/workflows/. Dưới đây là hướng dẫn chi tiết và code config bạn cần dùng.

Bước 1: Tạo file Workflow trên GitHub
Trên giao diện GitHub Actions như你在 screenshot, hãy click vào liên kết "set up a workflow yourself" (hoặc đi đến repository -> .github/ -> workflows/ -> tạo file mới).

Đặt tên file là: build.yml

Dán nội dung code YAML dưới đây vào file đó:


name: Build and Package AutoBuild Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bạn chạy thủ công từ giao diện GitHub anytime
    inputs:
      release_tag:
        description: 'Tag để tạo bản phát hành (ví dụ: v1.0)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest # Môi trường build chuẩn Linux
    
    steps:
      # Bước 1: Checkout code về máy build
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java (Minecraft 1.21.11 yêu cầu Java 17 trở lên)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bước 3: Cấp quyền thực thi cho Gradle Wrapper
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Bước 4: Build file Jar bằng Gradle
      - name: Build with Gradle
        run: ./gradlew jar

      # Bước 5: Đóng gói file .jar và Upload lên GitHub làm Artifact (để tải về)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autobuild-mod-jar # Tên của file khi bạn tải về (sẽ là file .zip chứa .jar)
          path: build/libs/*.jar
          retention-days: 7 # Giữ file kết quả trong 7 ngày để bạn có thể tải về

  # Job tạo Release tự động nếu bạn push tag (ví dụ: v1.0.0)
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'tags/v') # Chỉ chạy khi có tag bắt đầu bằng chữ 'v'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
        
      - name: Build jar
        run: ./gradlew jar
        
      - name: Create Release and Upload Jar
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          name: AutoBuild Release ${{ github.ref_name }}
          body: |
            ### AutoBuild Mod Release ${{ github.ref_name }}
            - Tải file `.jar` về và bỏ vào folder mods của Minecraft Launcher.
          draft: false
          prerelease: false
