Đây là phần quan trọng nhất. Dưới đây là toàn bộ code Java được tách class một cách rõ ràng, tối ưu hóa để dễ bảo trì và dễ upload lên GitHub. Bạn tạo file tại đường dẫn: src/main/java/com/autobuild/AutoBuildMod.java.


package com.autobuild;

import net.fabricmc.api.ClientModInitializer;
import net.fabricmc.fabric.api.client.event.v1.ClientTickEvents;
import net.minecraft.client.MinecraftClient;
import net.minecraft.client.network.ClientPlayerEntity;
import net.minecraft.client.screen.ChestScreen;
import net.minecraft.client.screen.Screen;
import net.minecraft.item.Item;
import net.minecraft.item.Items;
import net.minecraft.nbt.NbtCompound;
import net.minecraft.nbt.NbtIo;
import net.minecraft.nbt.NbtList;
import net.minecraft.nbt.NbtLongArray;
import net.minecraft.util.math.BlockPos;
import net.minecraft.util.math.Vec3d;
import net.minecraft.util.math.Direction;
import net.minecraft.util.Hand;
import net.minecraft.world.World;

import java.io.File;
import java.io.FileInputStream;
import java.io.IOException;
import java.util.*;
import java.util.stream.Collectors;

/**
 * AutoBuild Mod - Client-Side Fabric Mod
 * Tự động đọc file schematic (.litematic), lên kế hoạch xây từng tầng,
 * và tự động mở rương, click chuột lấy vật liệu khi thiếu.
 */
public class AutoBuildMod implements ClientModInitializer {

    public static final String MOD_ID = "autobuild";
    private static final MinecraftClient client = MinecraftClient.getInstance();

    // Trạng thái hệ thống
    public enum BuildState { IDLE, PLANNING, BUILDING, WITHDRAWING }
    public static BuildState currentState = BuildState.IDLE;

    // Dữ liệu schematic và kế hoạch xây
    public static List<SchematicLoader.ParsedBlock> currentSchematicBlocks = new ArrayList<>();
    public static Map<Integer, List<BuildPlanner.BuildStep>> plannedLayers = new HashMap<>();
    public static int currentLayerIndex = 0;
    public static int anchorX = 0, anchorY = 0, anchorZ = 0;

    @Override
    public void onInitializeClient() {
        System.out.println("AutoBuild Mod Initialized!");
        ClientTickEvents.END_CLIENT_TICK.register(client -> {
            tick();
        });
    }

    private static void tick() {
        if (client.player == null || client.world == null) return;

        switch (currentState) {
            case PLANNING:
                planBuild();
                currentState = BuildState.BUILDING;
                break;
            case BUILDING:
                executeBuildStep();
                break;
            case WITHDRAWING:
                ChestGUIManager.tickAutoWithdraw();
                break;
        }
    }

    private static void planBuild() {
        if (currentSchematicBlocks.isEmpty()) {
            System.out.println("No schematic loaded.");
            currentState = BuildState.IDLE;
            return;
        }

        if (client.player != null) {
            anchorX = client.player.getBlockX();
            anchorY = client.player.getBlockY();
            anchorZ = client.player.getBlockZ();
        }

        plannedLayers = BuildPlanner.planLayers(currentSchematicBlocks, anchorX, anchorY, anchorZ);
        currentLayerIndex = plannedLayers.keySet().stream().mapToInt(Integer::intValue).min().orElse(0);
        System.out.println("Build planned! Total layers: " + plannedLayers.size());
    }

    private static void executeBuildStep() {
        if (plannedLayers.isEmpty()) {
            System.out.println("Build Complete!");
            currentState = BuildState.IDLE;
            return;
        }

        List<BuildPlanner.BuildStep> layer = plannedLayers.get(currentLayerIndex);
        if (layer == null || layer.isEmpty()) {
            int nextLayer = plannedLayers.keySet().stream()
                    .filter(y -> y > currentLayerIndex)
                    .mapToInt(Integer::intValue)
                    .min().orElse(-1);
            if (nextLayer == -1) {
                System.out.println("All layers complete! Build done.");
                plannedLayers.clear();
                currentState = BuildState.IDLE;
            } else {
                System.out.println("Layer " + currentLayerIndex + " complete! Advancing to Layer " + nextLayer);
                currentLayerIndex = nextLayer;
            }
            return;
        }

        BuildPlanner.BuildStep step = layer.get(0);
        Item neededItem = parseItemFromState(step.blockStateString);

        if (!hasItemInHotbar(neededItem)) {
            ChestBlockEntity chest = findNearbyChestWithItem(neededItem);
            if (chest != null) {
                System.out.println("Item " + neededItem + " missing. Opening chest at " + chest.getPos());
                ChestGUIManager.startAutoWithdraw(chest, neededItem, 1);
                currentState = BuildState.WITHDRAWING;
                return;
            }
        }

        BlockPlacer.placeBlock(new(step.x, step.y, step.z), step.blockStateString);
        layer.remove(0);
    }

    private static boolean hasItemInHotbar(Item item) {
        if (client.player == null) return false;
        for (int i = 0; i < 9; i++) {
            if (client.player.getInventory().getStack(i).isOf(item)) return true;
        }
        return false;
    }

    private static ChestBlockEntity findNearbyChestWithItem(Item item) {
        // Logic tìm kiếm rương trong bán kính 16 blocks
        if (client.world == null || client.player == null) return null;
        // (Đây là phần mock logic, trong thực tế cần quét block entity trong chunk)
        return null;
    }

    private static Item parseItemFromState(String stateString) {
        String[] parts = stateString.split("\\[");
        String name = parts[0].split(":")[1].toLowerCase();
        switch (name) {
            case "dirt": return Items.DIRT;
            case "stone": return Items.STONE;
            case "obsidian": return Items.OBSIDIAN;
            case "redstone": return Items.REDSTONE;
            case "glass": return Items.GLASS;
            case "piston": return Items.PISTON;
            default: return Items.STONE;
        }
    }

    // =========================================================================
    // SECTION 1: CONFIGURATION
    // =========================================================================
    public static class Config {
        public static int ChestRadius = 16;
        public static int Reach = 5;
    }

    // =========================================================================
    // SECTION 2: SCHEMATIC PARSER (Đọc file .litematic)
    // =========================================================================
    public static class SchematicLoader {
        public static class ParsedBlock {
            public final int localX, localY, localZ;
            public final String blockStateString;
            public ParsedBlock(int x, int y, int z, String state) {
                this.localX = x; this.localY = y; this.localZ = z; this.blockStateString = state;
            }
        }

        public static List<ParsedBlock> loadSchematic(File file) throws IOException {
            List<ParsedBlock> blocks = new ArrayList<>();
            NbtCompound root;
            try (FileInputStream fis = new FileInputStream(file)) {
                root = NbtIo.readCompressed(fis);
            }

            NbtList sizeList = root.getList("Size", 10);
            int sizeX = sizeList.getInt(0);
            int sizeY = sizeList.getInt(1);
            int sizeZ = sizeList.getInt(2);

            NbtCompound regions = root.getCompound("Regions");
            for (String regionName : regions.getKeys()) {
                NbtCompound region = regions.getCompound(regionName);

                NbtList offsetList = region.getList("Offset", 10);
                int rX = offsetList.getInt(0);
                int rY = offsetList.getInt(1);
                int rZ = offsetList.getInt(2);

                NbtList paletteList = region.getList("BlockStatePalette", 10);
                Map<Integer, String> paletteMap = new HashMap<>();
                for (int i = 0; i < paletteList.size(); i++) {
                    NbtCompound paletteEntry = paletteList.getCompound(i);
                    String blockName = paletteEntry.getString("Name").orElse("minecraft:air");
                    paletteMap.put(i, blockName);
                }

                NbtLongArray statesArray = (NbtLongArray) region.get("BlockStates");
                long[] states = statesArray.getValue();

                NbtList regionSizeList = region.getList("Size", 10);
                int rSizeX = regionSizeList.getInt(0);
                int rSizeY = regionSizeList.getInt(1);
                int rSizeZ = regionSizeList.getInt(2);

                int bitsPerBlock = 32 - Integer.numberOfLeadingZeros(paletteMap.size() - 1);
                if (bitsPerBlock < 1) bitsPerBlock = 1;
                long mask = (1L << bitsPerBlock) - 1;

                int totalBlocks = rSizeX * rSizeY * rSizeZ;
                for (int i = 0; i < totalBlocks; i++) {
                    int index = (int) ((states[i / (64 / bitsPerBlock)] >> (i % (64 / bitsPerBlock) * bitsPerBlock)) & mask);
                    if (index == 0) continue;

                    int x = i % rSizeX;
                    int y = (i / rSizeX) / rSizeZ;
                    int z = (i / rSizeX) % rSizeZ;

                    int globalX = rX + x;
                    int globalY = rY + y;
                    int globalZ = rZ + z;

                    String stateString = paletteMap.get(index);
                    if (stateString != null && !stateString.equals("minecraft:air")) {
                        blocks.add(new ParsedBlock(globalX, globalY, globalZ, stateString));
                    }
                }
            }
            return blocks;
        }
    }

    // =========================================================================
    // SECTION 3: CHEST GUI MANAGER (Mở rương và Auto Click chuột)
    // =========================================================================
    public static class ChestGUIManager {
        private static ChestBlockEntity currentTargetChest = null;
        private static Item targetItem = null;
        private static int targetAmount = 0;
        private static int clickCount = 0;

        public static void startAutoWithdraw(ChestBlockEntity chest, Item item, int amount) {
            currentTargetChest = chest;
            targetItem = item;
            targetAmount = amount;
            clickCount = 0;
            openChest(chest);
        }

        private static void openChest(ChestBlockEntity chest) {
            ClientPlayerEntity player = client.player;
            if (player == null || client.world == null) return;
            Vec3d hitCenter = new Vec3d(chest.getPos().getX() + 0.5, chest.getPos().getY() + 0.5, chest.getPos().getZ() + 0.5);
            client.getInteractionManager().interactBlock(
                    player, client.world, Hand.MAIN_HAND, chest.getPos(),
                    Direction.UP, hitCenter
            );
        }

        public static void tickAutoWithdraw() {
            if (currentTargetChest == null) return;
            Screen screen = client.currentScreen;
            if (screen instanceof ChestScreen chestScreen) {
                int slotIndex = -1;
                for (int i = 0; i < currentTargetChest.getInventory().size(); i++) {
                    if (currentTargetChest.getInventory().getStack(i).isOf(targetItem)) {
                        slotIndex = i;
                        break;
                    }
                }
                if (slotIndex != -1) {
                    int slotX = chestScreen.getX() + (slotIndex % 9) * 18 + 9;
                    int slotY = chestScreen.getY() + (slotIndex / 9) * 18 + 9;
                    chestScreen.mouseClicked(slotX, slotY, 0);
                    clickCount++;

                    if (clickCount >= targetAmount) {
                        client.player.closeHandledScreen();
                        currentTargetChest = null;
                        currentState = BuildState.BUILDING;
                    }
                } else {
                    client.player.closeHandledScreen();
                    currentTargetChest = null;
                    currentState = BuildState.BUILDING;
                }
            } else {
                clickCount++;
                if (clickCount > 20) {
                    currentTargetChest = null;
                    currentState = BuildState.BUILDING;
                }
            }
        }
    }

    // =========================================================================
    // SECTION 4: BUILD PLANNER (Lên kế hoạch thứ tự xếp layer)
    // =========================================================================
    public static class BuildPlanner {
        public static class BuildStep {
            public final int x, y, z;
            public final String blockState;
            public final int priority;
            public BuildStep(int x, int y, int z, String state, int priority) {
                this.x = x; this.y = y; this.z = z; this.blockState = state; this.priority = priority;
            }
        }

        public static Map<Integer, List<BuildStep>> planLayers(List<SchematicLoader.ParsedBlock> blocks, int anchorX, int anchorY, int anchorZ) {
            Map<Integer, List<BuildStep>> layers = new HashMap<>();

            for (SchematicLoader.ParsedBlock parsed : blocks) {
                int tx = anchorX + parsed.localX;
                int ty = anchorY + parsed.localY;
                int tz = anchorZ + parsed.localZ;
                int priority = getPriority(parsed.blockStateString);
                layers.computeIfAbsent(ty, k -> new ArrayList<>())
                        .add(new BuildStep(tx, ty, tz, parsed.blockStateString, priority));
            }

            for (List<BuildStep> layer : layers.values()) {
                sortLayer(layer);
            }
            return layers;
        }

        private static int getPriority(String state) {
            String lower = state.toLowerCase();
            if (lower.contains("water") || lower.contains("lava")) return 2;
            if (lower.contains("piston") || lower.contains("observer") || lower.contains("redstone") || lower.contains("repeater") || lower.contains("comparator")) return 1;
            return 0;
        }

        private static void sortLayer(List<BuildStep> steps) {
            steps.sort(Comparator.comparingInt(s -> s.priority));
            List<BuildStep> p0 = steps.stream().filter(s -> s.priority == 0).collect(Collectors.toList());
            List<BuildStep> p1 = steps.stream().filter(s -> s.priority == 1).collect(Collectors.toList());
            List<BuildStep> p2 = steps.stream().filter(s -> s.priority == 2).collect(Collectors.toList());
            steps.clear();
            steps.addAll(p0); steps.addAll(p1); steps.addAll(p2);
        }
    }

    // =========================================================================
    // SECTION 5: BLOCK PLACER (Đặt block và dùng Kính làm giàn tạm)
    // =========================================================================
    public static class BlockPlacer {
        public static void placeBlock(BlockPos target, String blockStateString) {
            ClientWorld world = client.world;
            ClientPlayerEntity player = client.player;
            if (world == null || player == null) return;

            Item item = parseItem(blockStateString);

            // Nếu block dưới target là không khí, đặt kính tạm làm điểm tựa (scaffolding)
            if (world.getBlockState(target.down()).isAir()) {
                placeTemporarySupport(target.down());
            }

            Direction placeDirection = calculatePlacementDirection(blockStateString, target);
            Vec3d hitVec = new Vec3d(
                    target.getX() + 0.5 + placeDirection.getVectorZ() * 0.5,
                    target.getY() + 0.5 + placeDirection.getVectorY() * 0.5,
                    target.getZ() + 0.5 + placeDirection.getVectorX() * 0.5
            );

            selectItemInHotbar(item);
            client.getInteractionManager().interactBlock(
                    player, world, Hand.MAIN_HAND, target,
                    placeDirection.getOpposite(), hitVec
            );
        }

        private static void placeTemporarySupport(BlockPos pos) {
            ClientWorld world = client.world;
            ClientPlayerEntity player = client.player;
            if (world == null || player == null) return;
            Item glassItem = Items.GLASS;
            selectItemInHotbar(glassItem);
            client.getInteractionManager().interactBlock(
                    player, world, Hand.MAIN_HAND, pos, Direction.UP,
                    new Vec3d(pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5)
            );
        }

        private static Direction calculatePlacementDirection(String stateString, startPos) {
            if (stateString.contains("facing=")) {
                String facingStr = stateString.substring(stateString.indexOf("facing=") + 7).split(",")[0].toUpperCase();
                try {
                    return Direction.valueOf(facingStr);
                } catch (IllegalArgumentException e) {
                    return Direction.UP;
                }
            }
            return Direction.UP;
        }

        private static Item parseItem(String itemId) {
            String name = itemId.split(":")[1].toLowerCase();
            switch (name) {
                case "dirt": return Items.DIRT;
                case "stone": return Items.STONE;
                case "obsidian": return Items.OBSIDIAN;
                case "redstone": return Items.REDSTONE;
                case "glass": return Items.GLASS;
                case "piston": return Items.PISTON;
                default: return Items.STONE;
            }
        }

        private static void selectItemInHotbar(Item item) {
            ClientPlayerEntity player = client.player;
            if (player == null) return;
            for (int i = 0; i < 9; i++) {
                if (player.getInventory().getStack(i).isOf(item)) {
                    player.getInventory().selectedSlot = i;
                    return;
                }
            }
        }
    }
}
4. Cách thiết lập và Build trên GitHub
Để bạn có thể build mod này thành file .jar và dùng trên Minecraft:

Bước 1: Tạo repository trên GitHub
Tạo một repository mới trên GitHub tên là autobuild.
Copy các file trên và commit lên main branch.
Bước 2: Cài đặt Gradle Wrapper (Nếu chưa có)
GitHub không tự động cung cấp Gradle Wrapper. Bạn cần cài Gradle trên máy tính để generate file gradlew và gradlew.bat.

Cài Gradle: https://gradle.org/install/
Chạy dòng lệnh trong thư mục dự án:

gradle wrapper --gradle-version 8.5
